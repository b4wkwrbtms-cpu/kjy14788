<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#233041" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="설교 서가">
<meta name="format-detection" content="telephone=no">
<title>설교 서가</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preload" href="../fonts/maruburi-r.woff" as="font" type="font/woff" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&display=swap">
<style>
@font-face { font-family: "MaruBuri"; font-weight: 400; font-display: swap; src: url(../fonts/maruburi-r.woff) format("woff"); }
@font-face { font-family: "MaruBuri"; font-weight: 600 700; font-display: swap; src: url(../fonts/maruburi-sb.woff) format("woff"); }
@font-face { font-family: "NSDonghwa"; font-display: swap; src: url(../fonts/donghwa.woff) format("woff"); }
@font-face { font-family: "NSKkot"; font-display: swap; src: url(../fonts/kkot.woff) format("woff"); }
@font-face { font-family: "NSDahaeng"; font-display: swap; src: url(../fonts/dahaeng.woff) format("woff"); }
@font-face { font-family: "NSSeongsil"; font-display: swap; src: url(../fonts/seongsil.woff) format("woff"); }
@font-face { font-family: "NSMirae"; font-display: swap; src: url(../fonts/mirae.woff) format("woff"); }

/* ---------- 서재 (책을 고르는 곳) ---------- */
:root {
  --room: #233041; --room2: #1a2432; --plank: #5a4535; --plank2: #3c2e24; --gilt: #d6b66a; --lt: #ece6da; --mt: #a6b1bf; --line: #34435a; --focus: #f0d58c;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  --ui: "Apple SD Gothic Neo", "Pretendard", system-ui, sans-serif; --serif: "MaruBuri", "Apple SD Gothic Neo", serif;
}
* { box-sizing: border-box; }
html { color-scheme: dark; background: var(--room); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; font-family: var(--serif); color: var(--lt); background: linear-gradient(180deg, var(--room) 0, var(--room2) 100%) fixed; word-break: keep-all; overflow-wrap: anywhere; -webkit-tap-highlight-color: transparent; touch-action: manipulation; -webkit-font-smoothing: antialiased; }
body.reading { overflow: hidden; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 8px; top: -60px; z-index: 50; background: var(--gilt); color: #1a1408; padding: 10px 14px; border-radius: 8px; }
.skip:focus { top: calc(var(--sat) + 8px); }
#view { padding: calc(var(--sat) + 10px) calc(var(--sar) + 0px) calc(var(--sab) + 84px) calc(var(--sal) + 0px); max-width: 720px; margin: 0 auto; }
#view[hidden] { display: none; }

.lib-h { padding: 18px 20px 6px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.lib-h h1 { margin: 0; font-size: 27px; font-weight: 600; letter-spacing: -.01em; }
.lib-sum { margin: 0; font: 13px/1.4 var(--ui); color: var(--mt); white-space: nowrap; font-variant-numeric: tabular-nums; }

.cont { display: flex; gap: 14px; align-items: center; margin: 12px 16px 6px; padding: 14px 16px 14px 14px; border-radius: 12px; background: rgba(255, 255, 255, .045); border: 1px solid var(--line); text-decoration: none; min-height: 72px; }
.cont:active { background: rgba(255, 255, 255, .08); }
.cont-sw { flex: none; width: 30px; height: 46px; border-radius: 2px 4px 4px 2px; background: var(--c); box-shadow: inset 3px 0 0 rgba(0, 0, 0, .3), inset -1px 0 0 rgba(255, 255, 255, .08); position: relative; }
.cont-sw::after { content: ""; position: absolute; right: 6px; top: -4px; width: 7px; height: 20px; background: var(--gilt); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%); }
.cont-b { flex: 1; min-width: 0; }
.cont-b small { display: block; font: 12.5px/1.4 var(--ui); color: var(--gilt); }
.cont-b b { display: block; font-size: 17px; font-weight: 600; line-height: 1.4; margin: 2px 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cont-bar { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.cont-bar i { display: block; height: 100%; background: var(--gilt); }
.cont-meta { display: block; margin-top: 5px; font: 12px/1.3 var(--ui); color: var(--mt); }

.shelf-wrap { margin: 22px 0 0; }
.shelf-t { margin: 0 20px 2px; font: 600 14px/1.4 var(--ui); color: var(--mt); }
.shelf { display: flex; align-items: flex-end; gap: 5px; padding: 18px 20px 0; overflow-x: auto; scrollbar-width: none; scroll-padding: 20px; }
.shelf::-webkit-scrollbar { display: none; }
.plank { height: 14px; margin: 0 10px; border-radius: 2px; background: linear-gradient(180deg, #6d5442 0, var(--plank) 30%, var(--plank2) 100%); box-shadow: 0 10px 18px -8px rgba(0, 0, 0, .7); }
.spine { flex: none; position: relative; width: var(--w); height: var(--h); display: flex; flex-direction: column; align-items: center; padding: 14px 0 12px; border-radius: 3px 3px 1px 1px; text-decoration: none; color: var(--gilt);
  background: var(--c); background-image: linear-gradient(90deg, rgba(0, 0, 0, .38) 0, rgba(255, 255, 255, .09) 14%, rgba(255, 255, 255, 0) 34%, rgba(0, 0, 0, 0) 70%, rgba(0, 0, 0, .3) 100%), repeating-linear-gradient(0deg, rgba(255, 255, 255, .03) 0 1px, transparent 1px 3px);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .28), 2px 0 3px rgba(0, 0, 0, .25); transition: transform .18s ease-out; }
.spine:active { transform: translateY(-14px); }
.sp-band { width: 72%; height: 7px; border-top: 1.5px solid var(--gilt); border-bottom: 1.5px solid var(--gilt); opacity: .9; flex: none; }
.sp-t { flex: 1; min-height: 0; margin: 16px 0 10px; writing-mode: vertical-rl; font-size: 15px; font-weight: 600; letter-spacing: .1em; line-height: 1.1; white-space: nowrap; overflow: hidden; text-shadow: 0 1px 0 rgba(0, 0, 0, .35); }
.sp-t small { font-size: .78em; font-weight: 400; letter-spacing: .06em; opacity: .85; margin-top: .6em; }
.sp-w { text-orientation: upright; writing-mode: vertical-rl; font: 12px/1 var(--ui); letter-spacing: .1em; opacity: .85; margin: 8px 0 10px; flex: none; }
.sp-rib { position: absolute; top: -10px; right: 22%; width: 7px; height: 28px; background: var(--gilt); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%); }
.sp-done { flex: none; margin: -2px 0 8px; font: 10.5px/1 var(--ui); color: var(--gilt); opacity: .9; font-variant-numeric: tabular-nums; }
.spine.slot { background: none; border: 1.5px dashed #4a5a72; box-shadow: none; color: var(--mt); justify-content: center; }
.spine.slot .sp-t { font: 600 14px/1.1 var(--ui); flex: none; letter-spacing: .1em; }

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center; gap: 4px; padding: 6px calc(var(--sar) + 10px) calc(var(--sab) + 6px) calc(var(--sal) + 10px); background: rgba(26, 36, 50, .94); border-top: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.dock a { flex: 1; max-width: 160px; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; text-decoration: none; font: 12px/1.2 var(--ui); color: var(--mt); border-radius: 10px; }
.dock a svg { width: 22px; height: 22px; }
.dock a[aria-current="page"] { color: var(--gilt); }
body.reading .dock { display: none; }

/* ---------- 책 (표지와 차례) ---------- */
.topbar { display: flex; align-items: center; min-height: 48px; padding: 0 8px; }
.tb-back { display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; text-decoration: none; font: 16px/1 var(--ui); color: var(--mt); border-radius: 10px; }
.cover { position: relative; margin: 6px 18px 0; border-radius: 4px 10px 10px 4px; padding: 22px 20px 24px 32px; color: var(--gilt);
  background: var(--c); background-image: linear-gradient(90deg, rgba(0, 0, 0, .42) 0, rgba(0, 0, 0, .1) 5%, rgba(255, 255, 255, .06) 6.5%, rgba(255, 255, 255, 0) 22%), repeating-linear-gradient(0deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(0, 0, 0, .05) 0 1px, transparent 1px 4px);
  box-shadow: 0 22px 34px -22px rgba(0, 0, 0, .8), inset 0 0 0 1px rgba(0, 0, 0, .25); }
.cv-frame { border: 1px solid rgba(214, 182, 106, .6); outline: 1px solid rgba(214, 182, 106, .28); outline-offset: 5px; padding: 30px 14px 26px; text-align: center; }
.cv-who { margin: 0; font: 13px/1.4 var(--ui); letter-spacing: .12em; opacity: .9; }
.cv-t { margin: 14px 0 6px; font-size: 25px; font-weight: 600; line-height: 1.38; text-wrap: balance; text-shadow: 0 1px 0 rgba(0, 0, 0, .35); }
.cv-sub { margin: 0; font-size: 15px; opacity: .9; }
.cv-orn { display: block; width: 46px; height: 1px; margin: 20px auto 14px; background: var(--gilt); opacity: .7; }
.cv-meta { margin: 0; font: 13px/1.5 var(--ui); opacity: .85; font-variant-numeric: tabular-nums; }
.bk-act { display: flex; align-items: center; gap: 14px; margin: 22px 18px 4px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 20px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, .05); text-decoration: none; font: 600 15.5px/1 var(--ui); color: var(--lt); cursor: pointer; }
.btn.pri { background: var(--gilt); border-color: var(--gilt); color: #1d1608; }
.btn:active { filter: brightness(1.1); }
.btn.sm { min-height: 44px; padding: 0 14px; font-size: 14px; }
.btn.warn { color: #f0a08a; border-color: rgba(240, 160, 138, .45); }
.bk-prog { font: 13.5px/1.4 var(--ui); color: var(--mt); font-variant-numeric: tabular-nums; }
.sec-h { margin: 30px 20px 8px; font-size: 19px; font-weight: 600; }
.toc { list-style: none; margin: 0; padding: 0 10px; }
.toc-part { margin: 18px 10px 6px; font: 600 13px/1.4 var(--ui); color: var(--gilt); }
.toc a { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 10px 10px; border-radius: 10px; text-decoration: none; }
.toc a:active { background: rgba(255, 255, 255, .06); }
.toc-n { flex: none; width: 26px; text-align: right; font: 15px/1 var(--serif); color: var(--mt); font-variant-numeric: tabular-nums; }
.toc-b { flex: 1; min-width: 0; }
.toc-b b { display: block; font-size: 16.5px; font-weight: 600; line-height: 1.45; }
.toc-b small { display: block; margin-top: 3px; font: 12.5px/1.45 var(--ui); color: var(--mt); }
.toc-s { flex: none; min-width: 40px; text-align: right; font: 12.5px/1 var(--ui); color: var(--mt); font-variant-numeric: tabular-nums; }
.toc a.done .toc-s { color: var(--gilt); }
.toc a.cur .toc-n { color: var(--gilt); }
.bk-note { display: block; margin: 18px 20px 0; font: 14px/1.5 var(--ui); color: var(--mt); }
.bk-info { margin: 18px 20px 0; border-top: 1px solid var(--line); }
.bk-info summary { min-height: 48px; display: flex; align-items: center; font-weight: 600; cursor: pointer; }
.bk-info p { font-size: 15px; line-height: 1.75; color: var(--lt); margin: 0 0 .8em; }
.gl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font: 14px/1.5 var(--ui); padding-bottom: 12px; }
.gl span { color: var(--mt); } .gl b { font-weight: 500; }

/* ---------- 찾기 · 모음 · 설정 ---------- */
.pg-h { margin: 8px 20px 14px; font-size: 25px; font-weight: 600; }
.field { display: block; margin: 0 20px; }
.field span { display: block; font: 600 13px/1.4 var(--ui); color: var(--mt); margin-bottom: 6px; }
.inp { width: 100%; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0, 0, 0, .18); color: var(--lt); font: 17px/1.3 var(--ui); }
.inp::placeholder { color: #7d8898; }
.find-f { display: flex; gap: 8px; margin: 0 16px; }
.find-f .inp { flex: 1; }
.note { margin: 10px 20px; font: 13.5px/1.6 var(--ui); color: var(--mt); }
.res { margin: 14px 10px 0; }
.res-g { margin: 0 0 14px; }
.res-g h3 { margin: 0 10px 4px; font-size: 16px; font-weight: 600; }
.res-g h3 small { font: 12px/1.3 var(--ui); color: var(--mt); margin-left: 6px; }
.res a { display: block; padding: 10px 10px; border-radius: 10px; text-decoration: none; font-size: 15px; line-height: 1.7; color: #cfd6df; }
.res a:active { background: rgba(255, 255, 255, .06); }
.res mark { background: rgba(214, 182, 106, .3); color: var(--lt); border-radius: 2px; }
.tabs { display: flex; gap: 6px; margin: 0 16px 6px; }
.tabs button { flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: none; color: var(--mt); font: 600 14.5px/1 var(--ui); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--gilt); border-color: var(--gilt); color: #1d1608; }
.mk { display: flex; align-items: stretch; gap: 4px; margin: 0 10px 2px; }
.mk a { flex: 1; min-width: 0; display: block; padding: 11px 10px; border-radius: 10px; text-decoration: none; }
.mk a:active { background: rgba(255, 255, 255, .06); }
.mk q { display: block; quotes: "“" "”"; font-size: 15px; line-height: 1.65; color: var(--lt); }
.mk .mk-note { display: block; margin-top: 4px; font: 13.5px/1.55 var(--ui); color: var(--gilt); }
.mk small { display: block; margin-top: 4px; font: 12px/1.4 var(--ui); color: var(--mt); }
.mk button { flex: none; width: 44px; border: 0; background: none; color: var(--mt); cursor: pointer; border-radius: 10px; font: 13px var(--ui); }
.empty { margin: 30px 24px; font-size: 15.5px; line-height: 1.75; color: var(--mt); }
.set-s { margin: 26px 0 0; }
.set-s > h2 { margin: 0 20px 10px; font-size: 18px; font-weight: 600; }
.set-s > p { margin: 0 20px 10px; font: 14px/1.6 var(--ui); color: var(--mt); }
.row-btn { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 20px 0; }
.pv { margin: 0 16px 10px; padding: 18px 20px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-family: var(--ff); font-size: var(--fs); line-height: var(--lh); }
.pv p { margin: 0; }
.pv b { color: var(--hi); font-weight: 600; }
.set-opts { margin: 0 16px; padding: 2px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0, 0, 0, .14); font-family: var(--ui); }
.lgf { display: grid; gap: 12px; margin: 6px 0 0; }
.err { margin: 8px 20px 0; font: 14px/1.5 var(--ui); color: #f0a08a; }
.ok { color: #9fd3a8; }
.toast { position: fixed; left: 50%; bottom: calc(var(--sab) + 92px); z-index: 80; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 11px 16px; border-radius: 12px; background: #e9e3d6; color: #1d1a16; font: 14.5px/1.45 var(--ui); box-shadow: 0 10px 28px rgba(0, 0, 0, .35); display: flex; gap: 12px; align-items: center; }
.toast[hidden] { display: none; }
.toast button { border: 0; background: none; color: #6b4a10; font: 700 14.5px var(--ui); min-height: 36px; padding: 0 4px; cursor: pointer; }
body.reading .toast { bottom: calc(var(--sab) + 54px); }

/* ---------- 읽기 화면: 바탕 다섯 가지 (대비 8~11:1, 순백·순흑 글자 없음) ---------- */
.thm { --bg: #f4eee3; --fg: #36322d; --mut: #77706a; --hi: #1f1c19; --acc: #7f601c; --accbg: rgba(127, 96, 28, .08); --line: #ddd4c4; --btn: #ebe4d6; --mark: rgba(214, 168, 56, .33); --ked: #2f5d9c; --kedbg: rgba(47, 93, 156, .07); --sel: rgba(127, 96, 28, .22); }
.thm.th-sepia { --bg: #ece0c6; --fg: #3b2f21; --mut: #7a6a52; --hi: #2a2016; --acc: #85561a; --accbg: rgba(133, 86, 26, .09); --line: #d5c5a3; --btn: #e3d4b3; --mark: rgba(196, 140, 40, .32); --ked: #3e5f88; --kedbg: rgba(62, 95, 136, .08); --sel: rgba(133, 86, 26, .22); }
.thm.th-gray { --bg: #2b2e34; --fg: #d0ccc4; --mut: #8f939b; --hi: #ebe7df; --acc: #d8b86a; --accbg: rgba(216, 184, 106, .08); --line: #3b3f47; --btn: #33373e; --mark: rgba(216, 184, 106, .27); --ked: #9cc0ff; --kedbg: rgba(156, 192, 255, .08); --sel: rgba(216, 184, 106, .25); }
.thm.th-night { --bg: #000; --fg: #b8b1a5; --mut: #6f6a62; --hi: #d4cdc0; --acc: #b89a58; --accbg: rgba(184, 154, 88, .09); --line: #1d1d1d; --btn: #111; --mark: rgba(184, 154, 88, .25); --ked: #8daee6; --kedbg: rgba(141, 174, 230, .08); --sel: rgba(184, 154, 88, .28); }
.thm.th-warm { --bg: #100c08; --fg: #c6a378; --mut: #7d6648; --hi: #dcb88a; --acc: #cf9450; --accbg: rgba(207, 148, 80, .1); --line: #2a2017; --btn: #1a140e; --mark: rgba(207, 148, 80, .26); --ked: #d0a46c; --kedbg: rgba(208, 164, 108, .08); --sel: rgba(207, 148, 80, .28); }
.thm { --ff: "MaruBuri", "Apple SD Gothic Neo", serif; --fk: 1; --lh: 1.85; }
.thm.f-batang { --ff: "Gowun Batang", "MaruBuri", serif; --fk: 1.04; }
.thm.f-sans { --ff: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; }
.thm.f-dodum { --ff: "Gowun Dodum", "Apple SD Gothic Neo", sans-serif; --fk: 1.03; }
.thm.f-donghwa { --ff: "NSDonghwa", "Gowun Dodum", sans-serif; --fk: 1.1; }
.thm.f-kkot { --ff: "NSKkot", "Gowun Dodum", sans-serif; --fk: 1.1; }
.thm.f-dahaeng { --ff: "NSDahaeng", "Gowun Dodum", sans-serif; --fk: 1.12; }
.thm.f-seongsil { --ff: "NSSeongsil", "Gowun Dodum", sans-serif; --fk: 1.06; }
.thm.f-mirae { --ff: "NSMirae", "Gowun Dodum", sans-serif; --fk: 1.06; }
.thm.lh-t { --lh: 1.65; } .thm.lh-w { --lh: 2.1; }
.thm { --fs: calc(var(--fsb, 18px) * var(--fk)); }

.reader { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); }
.reader[hidden] { display: none; }
.reader ::selection { background: var(--sel); }
.r-dim { position: absolute; inset: 0; z-index: 25; background: #000; opacity: 0; pointer-events: none; }
.r-top { flex: none; position: relative; z-index: 6; display: flex; align-items: center; gap: 2px; min-height: 50px; padding: calc(var(--sat) + 2px) calc(var(--sar) + 4px) 0 calc(var(--sal) + 4px); background: var(--bg); transition: opacity .2s ease-out; }
.r-ib { flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 2px; min-width: 44px; min-height: 44px; padding: 0 10px; border: 0; border-radius: 10px; background: none; color: var(--mut); cursor: pointer; font: 15.5px/1 var(--ui); }
.r-ib svg { width: 21px; height: 21px; }
.r-ib[aria-pressed="true"] { color: var(--acc); }
.r-ib[aria-pressed="true"] svg path { fill: currentColor; }
.r-aa { font: 600 16px/1 var(--serif); border: 1px solid var(--line); min-width: 46px; min-height: 38px; }
.r-tt { flex: 1; min-width: 0; text-align: center; font-family: var(--ui); line-height: 1.25; }
.r-tt b { display: block; font-size: 13.5px; font-weight: 600; color: var(--fg); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.r-tt small { display: block; font-size: 11.5px; color: var(--mut); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; margin-top: 2px; }
.r-prog { flex: none; height: 2px; margin: 4px 0 0; background: var(--line); position: relative; z-index: 6; }
.r-prog i { display: block; height: 100%; width: 0; background: var(--acc); }
.r-body { flex: 1; min-height: 0; position: relative; outline: none; }
.mode-scroll .r-body { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.mode-page .r-body { overflow: hidden; touch-action: pan-y pinch-zoom; }
.r-col { font-family: var(--ff); font-size: var(--fs); line-height: var(--lh); color: var(--fg); text-align: left; word-break: keep-all; overflow-wrap: anywhere; font-kerning: normal; text-rendering: optimizeLegibility; hanging-punctuation: first; orphans: 2; widows: 2; }

.reader.grain.th-paper::after, .reader.grain.th-sepia::after { opacity: .45; mix-blend-mode: multiply; }

  urls.push("../bible/lin.json"); for (let b = 1; b <= 66; b++) urls.push(`../bible/x/${String(b).padStart(2, "0")}.json`); for (let b = 1; b <= 12; b++) urls.push(`../bible/he/${String(b).padStart(2, "0")}.json`);
