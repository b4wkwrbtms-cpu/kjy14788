<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="곽준영키우기">
<meta name="theme-color" content="#0e1321">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
html { color-scheme: dark; -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
button, input, select, textarea { -webkit-tap-highlight-color: transparent; }
</style>
<title>곽준영 키우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one phone-width column — HUD chips, battle screen with buff bar, wallet, scrollable tab bar, tab panels. Night-office look, single dark theme by choice. */
:root {
  --bg: #0e1321;
  --panel: #171e31;
  --panel-2: #1e2740;
  --line: #2b3655;
  --fg: #e9edf6;
  --muted: #8d99b6;
  --gold: #ffd54a;   --gold-ink: #2a2206;
  --manna: #a8f0c6;  --manna-ink: #0b2a1a;
  --stamp: #ff7a6b;  --stamp-ink: #3a0b06;
  --ore: #6fd3ff;    --ore-ink: #06263a;
  --rare: #c9a6ff;
  --danger: #ff6b6b;
  --good: #7fe3a0;
  --display: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: calc(14px + env(safe-area-inset-top, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)); -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
html, body, * { touch-action: manipulation; }
html { overscroll-behavior-y: none; }
input, textarea, select, [contenteditable] { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.num { font-variant-numeric: tabular-nums; }
.c-gold { color: var(--gold); } .c-manna { color: var(--manna); } .c-stamp { color: var(--stamp); } .c-ore { color: var(--ore); } .c-rare { color: var(--rare); }

header { display: flex; flex-direction: column; gap: 8px; }
.title-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1; margin: 0; }
h1 small { display: block; font-family: var(--body); font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.floor-big { font-family: var(--display); font-size: 26px; line-height: 1; }
.floor-big small { font-size: 14px; color: var(--muted); margin-left: 2px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-family: var(--display); font-size: 14px; padding: 2px 9px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); white-space: nowrap; }
.chip b { font-weight: 400; }
.chip.live { border-color: var(--ore); color: var(--ore); }

.stage { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; position: relative; }
@media (max-width: 520px) { .stage { margin-inline: -16px; border-radius: 0; border-left: 0; border-right: 0; } }
.stage-top { padding: 9px 12px 7px; display: flex; flex-direction: column; gap: 5px; }
.run-line { font-family: var(--display); font-size: 13px; color: var(--muted); text-align: center; letter-spacing: .3px; }
.run-line b { font-weight: 400; color: var(--fg); }
.mon-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.mon-name { font-family: var(--display); font-size: 18px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mon-name.boss { color: var(--danger); } .mon-name.small { color: var(--gold); } .mon-name.vault { color: var(--ore); }
.mon-hp { font-size: 12px; color: var(--muted); white-space: nowrap; }
.bar { height: 9px; background: #0a0f1b; border-radius: 3px; overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: var(--danger); width: 100%; transition: width .08s linear; }
.sub-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); min-height: 18px; }
.pips { display: flex; gap: 4px; }
.pips span { width: 20px; height: 6px; border-radius: 1px; background: var(--line); }
.pips span.on { background: var(--gold); }
.pips span.bs { outline: 1px solid var(--gold); }
.timer { flex: 1; height: 6px; background: #0a0f1b; border-radius: 3px; overflow: hidden; }
.timer > i { display: block; height: 100%; background: var(--gold); width: 100%; }
#cv { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; cursor: pointer; touch-action: manipulation; }
.hint { position: absolute; left: 0; right: 0; top: 58%; text-align: center; font-size: 12px; color: rgba(233,237,246,.6); pointer-events: none; transition: opacity .6s; }
.retry { position: absolute; right: 10px; top: 72px; font-family: var(--display); font-size: 15px; border: 0; border-radius: 8px; padding: 7px 12px; background: var(--danger); color: #fff; cursor: pointer; box-shadow: 0 3px 0 #9c3434; }
.buffbar { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line); }
.buffbar button { flex: 1; font-family: var(--display); font-size: 13px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); border-radius: 8px; padding: 5px 4px; cursor: pointer; line-height: 1.15; }
.buffbar button small { display: block; font-family: var(--body); font-size: 11px; color: var(--muted); }
.buffbar button.on { border-color: var(--gold); color: var(--gold); }
.buffbar button:disabled { opacity: .45; cursor: not-allowed; }

.wallet { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding: 0 2px; }
.gold { font-family: var(--display); font-size: 30px; line-height: 1; color: var(--gold); }
.gold small { font-size: 16px; margin-left: 2px; }
.gold { display: inline-block; transform-origin: left bottom; }
.gold.bump { animation: goldBump .32s ease-out; }
@keyframes goldBump { 0% { transform: scale(1); } 35% { transform: scale(1.16); color: #fff7c2; } 100% { transform: scale(1); } }
.gold-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
.dps { text-align: right; font-size: 12px; color: var(--muted); }
.dps b { display: block; font-family: var(--display); font-weight: 400; font-size: 18px; color: var(--fg); }

.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: 1 0 auto; font-family: var(--display); font-size: 15px; border: 0; background: transparent; color: var(--muted); padding: 6px 10px; border-radius: 7px; cursor: pointer; position: relative; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--panel-2); color: var(--fg); }
.tabs button .dot { position: absolute; top: 4px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }

.panel { display: flex; flex-direction: column; gap: 8px; }
.sec-title { font-family: var(--display); font-size: 18px; margin: 6px 0 0; font-weight: 400; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sec-title small { font-family: var(--body); font-size: 12px; color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.card.hero-card { border-color: #3a4670; }
.muted { color: var(--muted); font-size: 13px; }
.card p { margin: 0; }
.up { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.up.locked { opacity: .62; }
.up.owned-leg { border-color: #5b4a8f; }
.icon { width: 44px; height: 44px; border-radius: 8px; background: var(--panel-2); display: grid; place-items: center; font-family: var(--display); font-size: 19px; color: var(--muted); overflow: hidden; }
.icon canvas { width: 40px; height: 40px; image-rendering: pixelated; }
.up-info { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.up-name { font-family: var(--display); font-size: 16px; line-height: 1.2; }
.up-name .lv { font-family: var(--body); font-size: 12px; color: var(--muted); margin-left: 4px; }
.up-desc { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.up-desc b { color: var(--good); font-weight: 400; }
.qbar { height: 5px; background: #0a0f1b; border-radius: 3px; overflow: hidden; margin-top: 3px; }
.qbar > i { display: block; height: 100%; width: 0; background: var(--gold); }
.buy { font-family: var(--display); font-size: 14px; min-width: 84px; border: 0; border-radius: 8px; padding: 7px 9px; background: var(--gold); color: var(--gold-ink); cursor: pointer; box-shadow: 0 3px 0 #b8941c; line-height: 1.15; }
.buy.manna { background: var(--manna); color: var(--manna-ink); box-shadow: 0 3px 0 #5fb187; }
.buy.stamp { background: var(--stamp); color: var(--stamp-ink); box-shadow: 0 3px 0 #b5463a; }
.buy.ore { background: var(--ore); color: var(--ore-ink); box-shadow: 0 3px 0 #2b8fb8; }
.buy.rare { background: var(--rare); color: #1f0b3a; box-shadow: 0 3px 0 #7a5cb8; }
.buy.ghost { background: var(--panel-2); color: var(--fg); box-shadow: 0 3px 0 #10162a; }
.buy small { display: block; font-size: 11px; opacity: .78; }
.buy:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }
.buy:disabled { background: var(--panel-2); color: var(--muted); box-shadow: 0 3px 0 #10162a; cursor: not-allowed; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--ore); outline-offset: 2px; }
.btn { font-family: var(--display); font-size: 15px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; background: var(--panel-2); color: var(--fg); cursor: pointer; }
.btn.primary { background: var(--ore); border-color: var(--ore); color: var(--ore-ink); }
.btn.manna { background: var(--manna); border-color: var(--manna); color: var(--manna-ink); }
.btn.warn { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stat { background: var(--panel-2); border-radius: 8px; padding: 7px 8px; min-width: 0; }
.stat span { display: block; font-size: 11px; color: var(--muted); }
.stat b { font-family: var(--display); font-weight: 400; font-size: 17px; }
.prog { height: 7px; background: #0a0f1b; border-radius: 4px; overflow: hidden; }
.prog > i { display: block; height: 100%; width: 0; background: var(--manna); }
.prog.ore > i { background: var(--ore); }

/* weapon */
.wcard { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; }
.wcard canvas { width: 96px; height: 96px; image-rendering: pixelated; background: var(--panel-2); border-radius: 10px; }
.wname { font-family: var(--display); font-size: 20px; line-height: 1.15; }
.wname .plus { color: var(--gold); margin-left: 4px; }
.wname.leg { color: var(--rare); }
.story { font-size: 12.5px; color: var(--muted); font-style: italic; }
.stars { display: flex; gap: 3px; }
.stars i { width: 14px; height: 6px; border-radius: 1px; background: var(--line); }
.stars i.on { background: var(--gold); }
.dex { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.dex button { aspect-ratio: 1; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 0; cursor: pointer; display: grid; place-items: center; position: relative; }
.dex button canvas { width: 100%; height: 100%; image-rendering: pixelated; }
.dex button.sel { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.dex button.leg { border-color: #4a3d78; }
.dex button:disabled { cursor: default; }
.dex button .lk { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 13px; color: var(--muted); }

/* bible */
.seg { display: flex; background: var(--panel-2); border-radius: 8px; padding: 2px; }
.seg button { flex: 1; font-family: var(--display); font-size: 14px; border: 0; background: transparent; color: var(--muted); padding: 5px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--fg); }
.books { display: flex; flex-wrap: wrap; gap: 5px; }
.books button { font-family: var(--body); font-size: 13px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); border-radius: 6px; padding: 3px 8px; cursor: pointer; position: relative; }
.books button.sel { border-color: var(--manna); color: var(--manna); }
.books button.done { background: #1d3a2c; }
.chapters { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 5px; }
.chapters button { font-family: var(--display); font-size: 15px; height: 36px; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); border-radius: 6px; cursor: pointer; }
.chapters button.read { background: #23405a; color: var(--fg); border-color: #2f5878; }
.chapters button.today { background: var(--manna); color: var(--manna-ink); border-color: var(--manna); }
textarea, input[type=text] { width: 100%; font-family: var(--body); font-size: 14px; background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; resize: vertical; }

/* study */
.clock { font-family: var(--display); font-size: 48px; line-height: 1; text-align: center; letter-spacing: 1px; }
.confirm { background: #3a2f0b; border: 1px solid var(--gold); border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.confirm p { margin: 0; font-size: 13px; color: var(--gold); }
.mine-row { display: flex; align-items: center; gap: 10px; }
.mine-row canvas { width: 120px; height: 90px; image-rendering: pixelated; border-radius: 8px; background: #120e0a; flex-shrink: 0; }
.mine-row > div { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
.log { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--muted); }
.log div { display: flex; justify-content: space-between; gap: 8px; }

.profile { display: grid; grid-template-columns: 112px 1fr; gap: 12px; align-items: center; }
.profile canvas { width: 112px; height: 112px; image-rendering: pixelated; border-radius: 10px; background: #141a2c; }
.pstats { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 13px; min-width: 0; }
.pstats span { color: var(--muted); white-space: nowrap; }
.pstats b { font-family: var(--display); font-weight: 400; color: var(--gold); text-align: right; font-size: 15px; overflow: hidden; text-overflow: ellipsis; }
.coll { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
.cell { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; align-items: center; padding: 3px 2px 2px; min-width: 0; }
.cell canvas { width: 100%; height: auto; aspect-ratio: 1; image-rendering: pixelated; }
.cell em { font-style: normal; font-family: var(--display); font-size: 11px; color: var(--gold); line-height: 1.2; white-space: nowrap; }
.cell.off { opacity: .32; }
.cell.max { border-color: #8a6d1a; }
.task { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; }
.task .t-name { font-family: var(--display); font-size: 15px; }
.task .t-sub { font-size: 12px; color: var(--muted); }
.task.done { opacity: .55; }

/* 암송 */
.mem-box { border-color: var(--manna); }
.mem-head { display: flex; justify-content: space-between; gap: 8px; font-family: var(--display); font-size: 17px; }
.mem-head span:last-child { color: var(--muted); font-size: 14px; }
.mem-stage { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.mem-stage .stars i { width: 12px; }
.verse { font-size: 17px; line-height: 1.75; background: var(--panel-2); border-radius: 10px; padding: 12px 14px; word-break: keep-all; }
.verse mark.key { background: transparent; color: var(--gold); font-weight: 700; }
.verse .sl { color: var(--line); margin: 0 2px; }
.verse .blank { display: inline-block; color: var(--muted); border-bottom: 2px solid var(--muted); min-width: 3em; text-align: center; letter-spacing: -2px; }
.verse .blank.cur { color: var(--manna); border-color: var(--manna); }
.q { margin: 0; font-family: var(--display); font-size: 16px; }
.answer { min-height: 48px; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border: 1px dashed var(--line); border-radius: 10px; }
.pool, .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opts .btn { flex: 1 1 140px; text-align: left; font-family: var(--body); font-size: 14px; line-height: 1.4; }
.chunk { font-family: var(--body); font-size: 15px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); border-radius: 8px; padding: 7px 10px; cursor: pointer; text-align: left; }
.chunk.ok { background: #1d3a2c; border-color: var(--manna); cursor: default; }
.hint-cho { font-size: 18px; letter-spacing: 2px; color: var(--manna); background: var(--panel-2); border-radius: 8px; padding: 10px 12px; line-height: 1.7; word-break: keep-all; }
.mem-result { display: flex; flex-direction: column; gap: 3px; border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.mem-result b { font-family: var(--display); font-weight: 400; font-size: 20px; }
.mem-result.pass { background: #173326; color: var(--manna); }
.mem-result.fail { background: #3a1a1a; color: #ffb3a8; }
.memday { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.memday.locked { opacity: .55; }
.memday-h { width: 100%; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; background: transparent; border: 0; color: var(--fg); padding: 9px 12px; cursor: pointer; text-align: left; }
.memday-h b { font-family: var(--display); font-weight: 400; font-size: 16px; }
.memday-h .ttl { font-size: 13px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.memday-h .dots { grid-column: 1 / -1; display: flex; gap: 4px; }
.dots i { flex: 1; height: 6px; border-radius: 2px; background: var(--line); }
.dots i.s1 { background: #2f5878; } .dots i.s2 { background: #3b7bd6; } .dots i.s3 { background: #4fa8c9; } .dots i.s4 { background: #5fc9a8; }
.dots i.s5, .dots i.s6 { background: var(--manna); } .dots i.s7 { background: var(--gold); }
.dots i.due { outline: 1px solid var(--gold); }
.memlist { display: flex; flex-direction: column; gap: 4px; padding: 0 10px 10px; }
.memv { display: grid; grid-template-columns: 36px 1fr; gap: 0 8px; text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; color: var(--fg); cursor: pointer; font-family: var(--body); }
.memv span { grid-row: span 2; color: var(--muted); font-size: 12px; align-self: center; }
.memv b { font-weight: 400; font-family: var(--display); font-size: 15px; }
.memv small { color: var(--muted); font-size: 12px; }
.memv:disabled { cursor: not-allowed; }
/* 캐릭터, 도감 */
.charcell { cursor: pointer; font-family: var(--body); color: var(--fg); }
.charcell small { font-size: 10px; color: var(--muted); line-height: 1.2; text-align: center; }
.chars { grid-template-columns: repeat(4, 1fr); }
.dexzone { display: flex; flex-direction: column; gap: 4px; }
.dexzone.off .dexz-h b { color: var(--muted); }
.dexz-h { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--display); font-size: 15px; }
.dexz-h b { font-weight: 400; } .dexz-h small { color: var(--muted); font-size: 12px; }
.dexzone .cell em { font-size: 10px; white-space: normal; text-align: center; color: var(--fg); }
.ref-big { font-family: var(--display); font-size: 24px; color: var(--gold); text-align: center; }
.keychips { display: flex; flex-wrap: wrap; gap: 6px; }
.keychips span { background: var(--panel-2); border: 1px solid var(--gold); color: var(--gold); border-radius: 999px; padding: 4px 10px; font-size: 14px; }
.refin { display: grid; grid-template-columns: 1fr 64px auto 64px; gap: 6px; align-items: center; }
.refin select, .refin input { font-family: var(--body); font-size: 15px; background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; min-width: 0; width: 100%; }
.refin span { color: var(--muted); }
.verse .miss { color: #ff7a6b; text-decoration: underline; text-decoration-color: #ff7a6b; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--fg); color: var(--bg); font-family: var(--display); font-size: 15px; padding: 10px 16px; border-radius: 10px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; max-width: calc(100% - 32px); text-align: center; z-index: 9; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .bar > i, .toast { transition: none; } }

/* 성경 읽기 화면 */
.reader { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.reader[hidden] { display: none !important; }
.rd-top { display: flex; flex-direction: row; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
.rd-x { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); font-size: 17px; cursor: pointer; }
.rd-title { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.rd-title b { font-family: var(--display); font-weight: 400; font-size: 21px; }
.rd-title small { font-size: 12px; color: var(--muted); }
.rd-fs { display: flex; gap: 5px; }
.rd-fs button { font-family: var(--display); font-size: 14px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); border-radius: 8px; padding: 7px 9px; cursor: pointer; }
.rd-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 18px 18px 30px; font-size: 18px; line-height: 1.9; -webkit-user-select: text; user-select: text; }
.rd-body p { margin: 0 0 8px; word-break: keep-all; }
.rd-body sup { font-family: var(--display); font-size: .62em; color: var(--manna); margin-right: 5px; vertical-align: .45em; }
.rd-end { margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--line); display: flex; flex-direction: column; gap: 10px; font-size: 15px; line-height: 1.5; }
.rd-vers { display: flex; flex-wrap: wrap; gap: 6px; }
.rd-vers a { font-size: 13px; padding: 7px 11px; border-radius: 8px; border: 1px solid var(--line); color: var(--fg); text-decoration: none; background: var(--panel-2); }
.rd-bot { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); background: var(--panel); }
.rd-state { flex: 1; text-align: center; font-size: 12px; color: var(--muted); line-height: 1.3; }
.toast { z-index: 60; }

/* ===================== 게임 UI 꾸밈: 도트 RPG 창, 아래 메뉴바, 큰 버튼 ===================== */
:root { --edge: #0a0e1a; --hi: #35426e; --win1: #1f2847; --win2: #151b31; --dock: 64px; --c-silver: #e3e9f5; }
.c-silver { color: var(--c-silver); }
body { padding-bottom: calc(var(--dock) + 30px + env(safe-area-inset-bottom, 0px)); background: radial-gradient(140% 46% at 50% 0%, #1a2443 0%, rgba(14,19,33,0) 72%), var(--bg); }
.ri { display: inline-block; width: 16px; height: 16px; flex: none; background-position: center; background-size: contain; background-repeat: no-repeat; image-rendering: pixelated; vertical-align: -3px; }
.pix { image-rendering: pixelated; display: block; }

/* 머리: 제목, 엘리베이터 층 표시, 자원 알약 */
h1 { font-size: 27px; text-shadow: 0 3px 0 var(--edge); letter-spacing: .3px; }
h1 small { color: #a9b4d0; }
.floor-big { display: flex; align-items: baseline; gap: 2px; padding: 6px 11px 5px 9px; border-radius: 10px; background: linear-gradient(180deg, #130c07, #1e130a); border: 2px solid var(--edge); box-shadow: inset 0 0 0 1px #4a3218, inset 0 0 14px rgba(255,140,40,.18), 0 3px 0 rgba(0,0,0,.35); color: #ffb347; text-shadow: 0 0 8px rgba(255,150,50,.75); font-size: 25px; }
.floor-big .fl-up { font-style: normal; font-size: 11px; color: #ff7a3a; align-self: center; margin-right: 3px; animation: floorUp 1.6s ease-in-out infinite; }
.floor-big small { color: #c27a2e; text-shadow: none; }
@keyframes floorUp { 0%, 100% { opacity: .35; transform: translateY(1px); } 50% { opacity: 1; transform: translateY(-1px); } }
.chips { gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 11px 3px 5px; border-radius: 999px; background: linear-gradient(180deg, #0b101e, #161d33); border: 2px solid var(--edge); box-shadow: inset 0 0 0 1px #2c3657, inset 0 2px 3px rgba(0,0,0,.45); font-size: 15px; line-height: 1.25; }
.chip .ri { width: 18px; height: 18px; margin: -2px 0; filter: drop-shadow(0 1px 0 rgba(0,0,0,.6)); }
.chip.live { border-color: var(--edge); box-shadow: inset 0 0 0 1px var(--ore), 0 0 10px rgba(111,211,255,.25); color: var(--ore); padding-left: 11px; }

/* 전투 칸 */
.stage { border: 2px solid var(--edge); background: linear-gradient(180deg, #1c2443, #141a2f); box-shadow: inset 0 0 0 1px var(--hi), 0 4px 0 rgba(0,0,0,.35); }
@media (max-width: 520px) { .stage { border-left: 0; border-right: 0; box-shadow: inset 0 1px 0 var(--hi), inset 0 -1px 0 var(--hi); } }
.mon-name { text-shadow: 0 2px 0 var(--edge); }
.bar { height: 14px; background: #14090d; border: 2px solid var(--edge); border-radius: 5px; box-shadow: inset 0 0 0 1px #3c2230; position: relative; }
.bar > i { position: relative; z-index: 1; border-radius: 2px; background: linear-gradient(180deg, #ffa293 0 3px, #ff4d4d 3px 62%, #c62b3c 62% 100%); }
.bar > i.trail { position: absolute; left: 0; top: 0; bottom: 0; z-index: 0; background: #fff1a6; transition: width .5s ease-in .2s; }
.bar::after { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; background: repeating-linear-gradient(90deg, transparent 0 13px, rgba(0,0,0,.3) 13px 14px); }
.timer { height: 10px; border: 2px solid var(--edge); border-radius: 5px; box-shadow: inset 0 0 0 1px #3a3218; }
.timer > i { background: linear-gradient(180deg, #fff3b0 0 2px, #ffd54a 2px 65%, #d9a21c 65%); }
.pips { gap: 0; align-items: center; padding: 0 2px; background: linear-gradient(#2b3655, #2b3655) center / calc(100% - 26px) 2px no-repeat; }
.pips span { width: 10px; height: 10px; margin: 0 6px; border-radius: 2px; transform: rotate(45deg); background: #1a2138; border: 2px solid var(--edge); box-shadow: inset 0 0 0 1px #3a4774; }
.pips span.on { background: var(--gold); box-shadow: inset 0 0 0 1px #fff3b0, 0 0 8px rgba(255,213,74,.6); }
.pips span.now:not(.bs) { animation: pipNow 1s ease-in-out infinite; }
.pips span.bs { width: 22px; height: 22px; margin: -7px 0 -7px 4px; transform: none; border: 0; border-radius: 0; box-shadow: none; outline: 0; background-color: transparent; background-size: contain; background-repeat: no-repeat; background-position: center; image-rendering: pixelated; filter: grayscale(.85) brightness(.7); }
.pips span.bs.now { filter: none; animation: bossPulse .7s ease-in-out infinite; }
@keyframes pipNow { 0%, 100% { box-shadow: inset 0 0 0 1px #3a4774; } 50% { box-shadow: inset 0 0 0 1px #fff3b0, 0 0 8px rgba(255,213,74,.7); } }
@keyframes bossPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); filter: drop-shadow(0 0 4px rgba(255,77,77,.9)); } }

/* 버프 칸: 아이콘 + 개수 배지 + 남은 시간 막대 */
.buffbar { gap: 6px; padding: 8px 8px 9px; border-top: 2px solid var(--edge); background: linear-gradient(180deg, #161d34, #10162a); box-shadow: inset 0 1px 0 var(--hi); }
.buffbar button { position: relative; display: flex; align-items: center; gap: 6px; padding: 5px 5px 8px; text-align: left; border: 2px solid var(--edge); border-radius: 10px; background: linear-gradient(180deg, #28325c, #1b2242); box-shadow: inset 0 0 0 1px #3d4a7a, 0 3px 0 rgba(0,0,0,.4); min-width: 0; overflow: hidden; }
.buffbar button:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 0 0 1px #3d4a7a, 0 1px 0 rgba(0,0,0,.4); }
.bf-ic { position: relative; flex: none; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; background: #0c1121; box-shadow: inset 0 0 0 1px #2c3657; }
.bf-n { position: absolute; right: -4px; bottom: -4px; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px; background: #ff4d4d; color: #fff; font: 11px/15px var(--display); font-style: normal; text-align: center; box-shadow: 0 0 0 2px var(--edge); }
.bf-n:empty { display: none; }
.bf-t { min-width: 0; font-size: 13.5px; line-height: 1.12; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.buffbar .bf-t small { display: block; font-size: 10.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.bf-bar { position: absolute; left: 5px; right: 5px; bottom: 3px; height: 3px; border-radius: 2px; background: rgba(0,0,0,.35); }
.bf-bar > i { display: block; height: 100%; width: 0; border-radius: 2px; background: var(--gold); transition: width .25s linear; }
.buffbar button.on { color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold), 0 0 12px rgba(255,213,74,.35), 0 3px 0 rgba(0,0,0,.4); }
.buffbar button.on .bf-ic canvas { animation: buffBob .9s ease-in-out infinite; }
.buffbar button.on .bf-t small { color: var(--gold); }
#soundBtn.on { color: var(--fg); box-shadow: inset 0 0 0 1px #3d4a7a, 0 3px 0 rgba(0,0,0,.4); }
#soundBtn.on .bf-ic canvas { animation: none; }
#soundBtn .bf-bar { display: none; }
#soundBtn { flex: 0 0 46px; justify-content: center; padding: 5px 0 8px; }
#soundBtn .bf-t { display: none; }
.buffbar button.bf:not(#soundBtn) { flex: 1 1 0; }
@keyframes buffBob { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-2px) scale(1.12); } }
.retry { border: 2px solid rgba(0,0,0,.5); box-shadow: inset 0 2px 0 rgba(255,255,255,.35), 0 3px 0 #8c2c2c; }

/* 지갑 */
.wallet { padding: 9px 12px; border-radius: 12px; align-items: center; background: linear-gradient(180deg, #1f2846, #151b30); border: 2px solid var(--edge); box-shadow: inset 0 0 0 1px #4d421d, 0 3px 0 rgba(0,0,0,.35); }
.gold { display: inline-flex; align-items: center; gap: 6px; text-shadow: 0 2px 0 var(--edge), 0 0 14px rgba(255,213,74,.25); }
.gold .ri { width: 26px; height: 26px; vertical-align: 0; }
.dps b { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }

/* 아래 메뉴바 */
.tabs { position: fixed; z-index: 30; left: 0; right: 0; top: auto; bottom: 0; margin: 0 auto; max-width: 560px; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 1px; overflow: visible; padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); border: 2px solid var(--edge); border-bottom: 0; border-radius: 16px 16px 0 0; background: linear-gradient(180deg, #242d50, #121830 72%); box-shadow: inset 0 1px 0 #46548c, 0 -10px 24px rgba(0,0,0,.45); transition: transform .2s ease; }
.tabs button { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; min-width: 0; height: 54px; padding: 2px 0 4px; border-radius: 11px; font-size: 12px; line-height: 1; color: #7d89aa; background: transparent; white-space: nowrap; }
.tabs button canvas { filter: saturate(.55) brightness(.75); transition: transform .18s ease, filter .18s ease; }
.tabs button .tl { display: block; letter-spacing: -.3px; }
.tabs button[aria-selected="true"] { color: var(--gold); background: linear-gradient(180deg, rgba(255,213,74,.28), rgba(255,213,74,.05)); box-shadow: inset 0 0 0 1px rgba(255,213,74,.6), 0 0 14px rgba(255,213,74,.16); }
.tabs button[aria-selected="true"] canvas { filter: drop-shadow(0 2px 0 rgba(0,0,0,.45)); transform: translateY(-3px) scale(1.12); }
.tabs button:active canvas { transform: scale(.9); }
.tabs button .dot { top: 1px; right: calc(50% - 21px); width: 12px; height: 12px; border-radius: 50%; background: #ff4d4d; border: 2px solid #1b2240; box-shadow: 0 0 6px rgba(255,77,77,.75); animation: dotPulse 1.6s ease-in-out infinite; }
@keyframes dotPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
body.typing .tabs { transform: translateY(130%); }
.toast { bottom: calc(var(--dock) + 22px + env(safe-area-inset-bottom, 0px)); border: 2px solid var(--edge); box-shadow: inset 0 0 0 1px #ffffff, 0 4px 0 rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4); }

/* 탭 머리띠 (위에 붙어 다님) */
.tab-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 7px; border-radius: 12px; border: 2px solid var(--edge); background: linear-gradient(90deg, var(--acc-a, rgba(255,213,74,.18)), rgba(23,30,49,0) 62%), linear-gradient(180deg, #232c4d, #161d35); box-shadow: inset 0 0 0 1px var(--hi), inset 4px 0 0 var(--acc, #ffd54a), 0 6px 14px rgba(0,0,0,.4); }
.tab-head[data-tab="weapon"] { --acc: #ffd54a; --acc-a: rgba(255,213,74,.2); }
.tab-head[data-tab="bible"], .tab-head[data-tab="mem"] { --acc: #a8f0c6; --acc-a: rgba(168,240,198,.18); }
.tab-head[data-tab="study"], .tab-head[data-tab="suit"] { --acc: #6fd3ff; --acc-a: rgba(111,211,255,.18); }
.tab-head[data-tab="pet"] { --acc: #ffb36b; --acc-a: rgba(255,155,61,.2); }
.tab-head[data-tab="treasure"], .tab-head[data-tab="retire"] { --acc: #ff8a7a; --acc-a: rgba(255,122,107,.2); }
.tab-head[data-tab="daily"] { --acc: #7fe3a0; --acc-a: rgba(127,227,160,.18); }
.tab-head[data-tab="info"] { --acc: #c9a6ff; --acc-a: rgba(201,166,255,.18); }
.th-ic { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.12), rgba(0,0,0,.28)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.th-t { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.15; }
.th-t b { font: 400 20px var(--display); color: var(--acc, var(--gold)); text-shadow: 0 2px 0 var(--edge); }
.th-t small { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.th-cur { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.th-cur span { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px 2px 4px; border-radius: 999px; background: #0b101e; border: 2px solid var(--edge); box-shadow: inset 0 0 0 1px #2c3657; font: 15px var(--display); line-height: 1.2; }
.th-cur .ri { width: 17px; height: 17px; }
#panels > .panel:not([hidden]) { animation: panelIn .24s ease-out; }
@keyframes panelIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* 창(카드)·줄 */
.card, .up, .task, .memday { position: relative; background: linear-gradient(180deg, var(--win1), var(--win2)); border: 2px solid var(--edge); box-shadow: inset 0 0 0 1px var(--hi), inset 0 2px 0 1px rgba(255,255,255,.04), 0 3px 0 rgba(0,0,0,.35); }
.card.hero-card { background: linear-gradient(#c9a43a, #c9a43a) top 5px left 5px / 4px 4px no-repeat, linear-gradient(#c9a43a, #c9a43a) top 5px right 5px / 4px 4px no-repeat, linear-gradient(#c9a43a, #c9a43a) bottom 5px left 5px / 4px 4px no-repeat, linear-gradient(#c9a43a, #c9a43a) bottom 5px right 5px / 4px 4px no-repeat, linear-gradient(180deg, #242d50, #171e36); box-shadow: inset 0 0 0 1px #5a4a22, inset 0 2px 0 1px rgba(255,255,255,.05), 0 3px 0 rgba(0,0,0,.35); }
.up { grid-template-columns: 48px 1fr auto; gap: 11px; padding: 9px 9px 9px 9px; }
.up.locked { opacity: .7; }
.up.locked .icon canvas { filter: grayscale(.7) brightness(.7); }
.up.owned-leg { box-shadow: inset 0 0 0 1px #8a6cff, inset 0 2px 0 1px rgba(255,255,255,.04), 0 3px 0 rgba(0,0,0,.35), 0 0 14px rgba(150,110,255,.18); }
.icon { position: relative; overflow: visible; width: 48px; height: 48px; border-radius: 10px; background: radial-gradient(circle at 50% 38%, #2c3760, #11172a 78%); border: 2px solid var(--edge); box-shadow: inset 0 0 0 1px #3a4774, inset 0 -4px 0 rgba(0,0,0,.25); }
.icon canvas { border-radius: 6px; }
.up.owned-leg .icon { box-shadow: inset 0 0 0 1px #9d84ff, inset 0 -4px 0 rgba(0,0,0,.25), 0 0 10px rgba(160,120,255,.4); }
.lvb { position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); padding: 1px 6px 0; border-radius: 7px; background: #0a0e1a; border: 1px solid #3a4774; color: var(--gold); font: 11px/14px var(--display); white-space: nowrap; z-index: 1; }
.lvb.mx { color: #6fd3ff; border-color: #2b8fb8; }
.up-name { text-shadow: 0 1px 0 var(--edge); }
.up.pop { animation: rowPop .5s ease-out; }
.up.pop .icon canvas, .task.pop .buy, .card.pop canvas { animation: icBounce .45s ease-out; }
@keyframes rowPop { 0% { box-shadow: inset 0 0 0 2px #ffd54a, 0 0 18px rgba(255,213,74,.6), 0 3px 0 rgba(0,0,0,.35); } 100% { box-shadow: inset 0 0 0 1px var(--hi), 0 3px 0 rgba(0,0,0,.35); } }
.task.pop, .card.pop { animation: rowPop .5s ease-out; }
@keyframes icBounce { 0% { transform: scale(1); } 35% { transform: scale(1.22) rotate(-6deg); } 70% { transform: scale(.94); } 100% { transform: scale(1); } }
.upfx { position: absolute; right: 18px; top: 0; z-index: 3; pointer-events: none; font: 17px var(--display); color: #7fe3a0; text-shadow: 0 2px 0 var(--edge), 0 0 10px rgba(127,227,160,.7); animation: upfx .95s ease-out forwards; white-space: nowrap; }
@keyframes upfx { 0% { transform: translateY(8px) scale(.6); opacity: 0; } 18% { transform: translateY(0) scale(1.18); opacity: 1; } 100% { transform: translateY(-28px) scale(1); opacity: 0; } }

/* 큰 버튼: 위에 할 일, 아래에 아이콘+비용 */
.buy { position: relative; overflow: hidden; min-width: 90px; min-height: 46px; padding: 5px 9px 7px; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border: 2px solid rgba(0,0,0,.55); border-radius: 10px; --sh: #9a7a14; box-shadow: inset 0 2px 0 rgba(255,255,255,.5), inset 0 -3px 0 rgba(0,0,0,.14), 0 3px 0 var(--sh); text-shadow: 0 1px 0 rgba(255,255,255,.3); transition: transform .06s; }
.buy, .buy.manna, .buy.stamp, .buy.ore, .buy.rare, .buy.ghost { background-image: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0) 52%, rgba(0,0,0,.08)); }
.buy.manna { --sh: #3f8f68; box-shadow: inset 0 2px 0 rgba(255,255,255,.5), inset 0 -3px 0 rgba(0,0,0,.14), 0 3px 0 var(--sh); }
.buy.stamp { --sh: #a33a2f; box-shadow: inset 0 2px 0 rgba(255,255,255,.45), inset 0 -3px 0 rgba(0,0,0,.14), 0 3px 0 var(--sh); }
.buy.ore { --sh: #1f7aa3; box-shadow: inset 0 2px 0 rgba(255,255,255,.5), inset 0 -3px 0 rgba(0,0,0,.14), 0 3px 0 var(--sh); }
.buy.rare { --sh: #6a4cad; box-shadow: inset 0 2px 0 rgba(255,255,255,.5), inset 0 -3px 0 rgba(0,0,0,.14), 0 3px 0 var(--sh); }
.buy.ghost { --sh: #0a0e1a; background-color: #2a3459; color: var(--fg); text-shadow: 0 1px 0 var(--edge); box-shadow: inset 0 0 0 1px #46548c, inset 0 2px 0 rgba(255,255,255,.1), 0 3px 0 var(--sh); }
.buy small { order: 0; display: block; font-size: 11px; line-height: 1.15; opacity: .85; max-width: 150px; white-space: normal; }
.buy .cost { order: 1; display: flex; align-items: center; justify-content: center; gap: 3px; font-size: 16px; line-height: 1.12; white-space: nowrap; }
.buy .cost .ri { width: 16px; height: 16px; vertical-align: 0; filter: drop-shadow(0 1px 0 rgba(0,0,0,.35)); }
.buy .act { order: 0; font-size: 15px; line-height: 1.15; }
.buy .act + small { order: 1; }
.buy small .cur, .rws .rw, .cur { display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
.buy small .ri { width: 12px; height: 12px; }
.buy:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 2px 0 rgba(255,255,255,.4), inset 0 -2px 0 rgba(0,0,0,.14), 0 1px 0 var(--sh); }
.buy:not(:disabled):not(.ghost)::after { content: ""; position: absolute; top: -30%; bottom: -30%; left: -45%; width: 32%; background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.55), rgba(255,255,255,0)); transform: translateX(0) skewX(-18deg); animation: btnShine 3.4s ease-in-out infinite; animation-delay: inherit; pointer-events: none; }
@keyframes btnShine { 0%, 68% { transform: translateX(0) skewX(-18deg); } 100% { transform: translateX(480%) skewX(-18deg); } }
.buy:disabled { background-color: #252d4a; background-image: none; color: #7c87a6; text-shadow: none; border-color: var(--edge); box-shadow: inset 0 0 0 1px #323d63, 0 3px 0 #0b1020; }
.buy:disabled .cost { color: #ff8080; }
.buy:disabled .cost .ri { filter: grayscale(.4); opacity: .8; }

/* 무기 진열대 */

.actbar .buffbar button { flex: 0 1 40px; width: 40px; height: 40px; min-width: 32px; padding: 0; border-radius: 50%; justify-content: center; overflow: visible; background: radial-gradient(circle at 50% 35%, #34407a, #19203c 72%); box-shadow: inset 0 0 0 2px #3d4a7a, 0 3px 0 rgba(0,0,0,.45); }

/* 축하 팝업 */
.celeb { position: fixed; inset: 0; z-index: 55; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 45%, rgba(10,14,26,.4), rgba(5,8,16,.82)); cursor: pointer; }

/* 강화 편의: 도구줄(한 번에 ×1·×10·최대, 전부 쓰기), 자동 강화 스위치, 꾹 누르기, 초당 피해 +% */

button[data-rep] { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
.buy.holding:not(:disabled) { outline: 3px solid rgba(255,255,255,.55); outline-offset: 1px; }

.wallet .dps { position: relative; }
.dpsfx { position: absolute; right: 2px; bottom: 100%; font: 17px var(--display); color: #7fe3a0; text-shadow: 0 2px 0 var(--edge), 0 0 10px rgba(127,227,160,.6); pointer-events: none; white-space: nowrap; opacity: 0; }

@keyframes dpsUp { 0% { transform: translateY(10px) scale(.7); opacity: 0; } 15% { transform: translateY(0) scale(1.2); opacity: 1; } 70% { opacity: 1; } 100% { transform: translateY(-16px) scale(1); opacity: 0; } }

/* 복귀 정산서 · 출근부 */

.back { position: fixed; inset: 0; z-index: 57; display: grid; place-items: center; padding: calc(12px + env(safe-area-inset-top, 0px)) 14px calc(12px + env(safe-area-inset-bottom, 0px)); background: radial-gradient(circle at 50% 38%, rgba(12,16,30,.62), rgba(5,8,16,.9)); touch-action: none; overscroll-behavior: contain; }

/* 실제 시간으로 흐르는 연출 시계. 게임 시간 배율(슬로모션)을 돌려줌 */
function fxStep(dt) {
  if (lift) {
    lift.t += dt;
    if (!lift.swapped && lift.t >= L_CLOSED) lift.swapped = true;
    if (!lift.dinged && lift.t >= L_CLOSED + 60) { lift.dinged = true; dingSound(); }
    if (!lift.spawned && lift.t >= L_OPEN - 30) { lift.spawned = true; if (spawnWait > 0) spawnWait = 0.001; }
    if (lift.t >= L_END) lift = null;

  if (intro) {
    intro.t += dt;
    if (!intro.light && intro.kind >= 3 && intro.t < intro.dur * 0.45 && !reduceMotion) shakeAmt = Math.max(shakeAmt, 3.5);
    if (!intro.landed && intro.t >= intro.dur * 0.62) { intro.landed = true; if (mon) bossLand(); }
    if (intro.t >= intro.dur) intro = null;
  }
  if (stampFx) {

    if (!stampFx.hit && stampFx.t >= 230) { stampFx.hit = true; stampSound(); if (!reduceMotion) shakeAmt = Math.max(shakeAmt, stampFx.kind >= 2 ? 14 : 6); }
    if (stampFx.t > (stampFx.kind >= 2 ? 1500 : 950)) stampFx = null;

  AMB.planeCd -= dt / 1000;
  if (AMB.plane) { AMB.plane.x += dt * 0.045; if (AMB.plane.x > W + 30) AMB.plane = null; }
  else if (AMB.planeCd <= 0 && AMB.stars.length > 5 && (!bgSet || bgSet.amb.city)) { AMB.plane = { x: -30, y: 26 + Math.random() * 50 }; AMB.planeCd = 18 + Math.random() * 14; }
  if (slowMo > 0) { slowMo -= dt; return dt * 0.28; }
  return dt;
}
/* 게임 시간으로 움직이는 입자들 */
function fxPhys(dt) {
  const k = dt / 16;
  coins.forEach(c => {
    c.t += dt; if (c.t < 0) return;
    c.spin += 0.35 * k;
    if (!c.fly) {
      c.x += c.vx * k; c.y += c.vy * k; c.vy += 0.55 * k;
      if (c.y > GROUND - 4) { c.y = GROUND - 4; c.vy *= -0.45; c.vx *= 0.7; }
      if (c.t > 650) c.fly = true;
    } else {
      const tx = ACT_X + (VX0 + 24 - ACT_X) / ACT_S, ty = GROUND + (VY0 + VH + 30 - GROUND) / ACT_S, dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy) || 1, sp = Math.min(d, (6 + (c.t - 650) * 0.04) * k);
      c.x += dx / d * sp; c.y += dy / d * sp;
      if (d < 12 || c.y > H + 10) { c.done = true; coinSound(); bumpWallet(); }
    }

  coins = coins.filter(c => !c.done);
  puffs.forEach(p => { p.x += p.vx * k; p.y += p.vy * k; p.vx *= Math.pow(0.92, k); p.vy *= Math.pow(0.92, k); p.r += 0.35 * k; p.life -= dt / 520; });
  puffs = puffs.filter(p => p.life > 0);

    puffs.push({ x: MON_X + (Math.random() - .5) * mw * 0.5, y: GROUND - mh - 4, vx: (Math.random() - .5) * 0.8, vy: -1.4, r: 4, life: 1, c: "#ffffff" });
  }
}

const AMB = { stars: [], dust: Array.from({ length: 22 }, () => ({ x: Math.random() * W, y: 40 + Math.random() * (GROUND - 40), s: 1 + Math.random() * 2, v: 0.04 + Math.random() * 0.12, p: Math.random() * 6.28 })), plane: null, planeCd: 8, key: "" };

/* ===================== 타격 이펙트 2: 픽셀 초승달 베기, 충격 파열, 흙먼지, 하늘 낙뢰, 폭발, 임팩트 프레임 =====================
   이펙트는 1/3 해상도 레이어에 그린 뒤 픽셀 그대로 키워서 도트 그림과 어울리게 하고,
   빛나는 이펙트는 흐리게 키운 사본을 한 번 더 겹쳐 은은한 빛을 낸다. */
let slashes = [], bursts = [], dusts = [], eruptions = [], gflashes = [], strikes = [], explos = [];

const PXS = 3, PXW = Math.ceil(W / PXS), PXH = Math.ceil(H / PXS);
let pxCan = null, pxCtx = null, glCan = null, glCtx = null;
const SWING_CYCLE = ["rise", "sweep", "chop"];
// [치켜든 각도, 내리친 각도, 지나치는 양]  (0 = 위, 시계 방향 +)
const SWING_POSE = { chop: [-2.3, 2.05, 0.3], rise: [2.35, -0.35, -0.28], sweep: [-1.6, 1.65, 0.22], thrust: [0.9, 1.6, 0.06] };

const slashStyle = () => SLASH_STYLE[curFx()] || "steel";

const ang2phi = th => th - Math.PI / 2;
const heroPivot = () => ({ x: HERO_X + 10 + 15.5 * 3.5, y: GROUND - 84 + 1 + 16 * 3.5 });
function slashPal(style, crit, now) {
  if (crit) return ["#b3151b", "#ff5a3c", "#ffffff"];
  switch (style) {
    case "leaf": return ["#1f7a2a", "#5fe36a", "#eaffd8"];
    case "clone": return ["#4a2a8a", "#b18cff", "#f3eaff"];
    case "fire": return ["#a8200c", "#ff7a1a", "#ffe58a"];
    case "ice": return ["#1d56b0", "#5cc8ff", "#f2fdff"];
    case "volt": return ["#1b5fc1", "#7fe9ff", "#ffffff"];

    case "holy": return ["#b88a1a", "#ffe27a", "#ffffff"];
    case "magic": {

      return ["#7a1aa0", "#ff5fd2", "#ffe6fb"];
    }
    default: return ["#6f7d9c", "#d6e2f5", "#ffffff"];
  }
}

/* 초승달 모양: 바깥 호를 따라가다 안쪽으로 되돌아오며 가운데가 두껍고 양끝이 뾰족함 */

    const ri = r - thick * p; g.lineTo(cx + Math.cos(a) * ri, cy + Math.sin(a) * ri);

/* 베기 생성: 자동 공격은 올려베기 → 회전베기 → 내려찍기, 터치는 찌르기, 치명타는 X자 */
function addSlash(type, crit) {

  const p = heroPivot(), style = slashStyle(), big = crit ? 1.2 : 1, base = { t: 0, dur: crit ? 300 : 230, style, crit, seed: Math.random() * 100, flat: 1 };
  const mk = o => slashes.push(Object.assign({}, base, o));

  else if (type === "rise") mk({ type, cx: p.x, cy: p.y, r: 86 * big, a0: ang2phi(2.35), a1: ang2phi(-0.55), thick: 24 * big });
  else if (type === "thrust") mk({ type, x0: p.x + 14, y: p.y - 6, len: 175, w: 9, dur: 170 });
  else mk({ type: "chop", cx: p.x, cy: p.y, r: 90 * big, a0: ang2phi(-1.4), a1: ang2phi(2.3), thick: 27 * big });
  if (crit) mk({ type: "x", t: -70, cx: MON_X + 92, cy: GROUND - 172, r: 150, a0: 3.0, a1: 1.45, thick: 30, dur: 300 });
  if (style === "fire") for (let i = 0; i < 7; i++) sparks.push({ x: MON_X - 20 + Math.random() * 40, y: GROUND - 40 - Math.random() * 60, vx: (Math.random() - .5) * 3, vy: -2 - Math.random() * 4, life: 1, c: i % 2 ? "#ffb13b" : "#ff5a1f" });
  if (slashes.length > 7) slashes.splice(0, slashes.length - 7);
}
function drawSlash(g, s, now) {
  const k = s.t / s.dur; if (k < 0 || k >= 1) return false;

    const hx = s.x0 + s.len * Math.min(1, k / 0.2), tx = s.x0 + s.len * Math.max(0, (k - 0.22) / 0.78), w = s.w * (1 - 0.5 * k);

  if (drew && k < 0.75) {
    const u0 = Math.min(head, tail), span = head - u0, at = u => { const a = s.a0 + (s.a1 - s.a0) * u; return [Math.cos(a), Math.sin(a)]; };
    if (s.style === "volt") {
      g.strokeStyle = "#ffffff"; g.lineWidth = 3; g.beginPath();
      for (let i = 0; i <= 10; i++) { const u = u0 + span * i / 10, [c, sn] = at(u), rr = s.r - s.thick * 0.5 + (Math.random() - .5) * 22; g.lineTo(c * rr, sn * rr); }

/* 맞은 자리: 가시 별 + 끊어진 고리 */
function addBurst(x, y, crit) {

let toastT;
function toast(msg) { if (backOn) { backToast = msg; return; } const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2800); }

/* ===================== 저장 ===================== */
function save() { S.t = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function merge(d) {
  const b = freshState();
  const s = Object.assign(b, d);
  ["pets", "cos", "look", "ach"].forEach(k => s[k] = Object.assign({}, d[k] || {}));
  ["charms", "tre", "buffs", "active", "vault"].forEach(k => s[k] = Object.assign(freshState()[k], d[k] || {}));
  s.bible = Object.assign(freshState().bible, d.bible || {}); s.bible.read = Object.assign({}, (d.bible && d.bible.read) || {});
  s.study = Object.assign(freshState().study, d.study || {});
  s.mem = Object.assign(freshState().mem, d.mem || {}); s.mem.v = Object.assign({}, (d.mem && d.mem.v) || {});
  s.legUnlock = freshState().legUnlock.map((v, i) => !!(d.legUnlock && d.legUnlock[i]));
  s.att = attMerge(d.att); if (!d.att) attBackfill(s);
  if (s.away && typeof s.away !== "object") s.away = null;
  return s;
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY); if (!raw) return;
    const d = JSON.parse(raw); S = merge(d);
    if (TIME_LIMIT[bossKind(S.floor, S.k)]) S.k = 1;
    awaySettle(d.t || Date.now(), true);
  } catch (e) {}
}
setInterval(save, 5000);
